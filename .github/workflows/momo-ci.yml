name: momo CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: momo-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMO_DISABLE_POSTHOG: "true"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run typecheck
      - name: Build plugin and bundled tools
        run: bun run build
      - name: Run tests
        run: bun test
